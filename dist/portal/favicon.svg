<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Cyan-to-Neon Green Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ea8ff" />
      <stop offset="100%" stop-color="#4fffb0" />
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Stylized Stack/Grid graphical icon -->
  <g filter="url(#glow)">
    <!-- Node / Layer 1 -->
    <rect x="6" y="20" width="20" height="5" rx="1.5" fill="url(#brand-grad)" opacity="0.9" />
    <!-- Node / Layer 2 -->
    <rect x="9" y="13" width="14" height="5" rx="1.5" fill="url(#brand-grad)" opacity="0.75" />
    <!-- Node / Layer 3 -->
    <rect x="12" y="6" width="8" height="5" rx="1.5" fill="url(#brand-grad)" opacity="0.6" />
  </g>
</svg>
